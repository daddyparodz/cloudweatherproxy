name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hassfest:
    name: "Hassfest Validation"
    runs-on: [self-hosted, Linux, X64]
    container:
      image: python:3.13-bookworm
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Use the same official validator image directly so workspace mounts
      # are supplied by the runner rather than a shell inside another container.
      - name: "Run hassfest validation"
        uses: docker://ghcr.io/home-assistant/hassfest

  hacs:
    name: "HACS Validation"
    runs-on: [self-hosted, Linux, X64]
    container:
      image: python:3.13-bookworm
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: "Run HACS validation"
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"
